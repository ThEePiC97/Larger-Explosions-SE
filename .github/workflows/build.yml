name: Build Plugin
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore and Build
        run: |
          mkdir build_dir
          
          # Create the project file with the correct .NET Framework target
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <AssemblyName>LargerExplosionsSE</AssemblyName>
              <TargetFramework>net472</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <LangVersion>latest</LangVersion>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="Sandbox.Game">
                <HintPath>../libs/Sandbox.Game.dll</HintPath>
              </Reference>
              <Reference Include="VRage.Game">
                <HintPath>../libs/VRage.Game.dll</HintPath>
              </Reference>
              <Reference Include="VRage">
                <HintPath>../libs/VRage.dll</HintPath>
              </Reference>
              <Reference Include="VRage.Math">
                <HintPath>../libs/VRage.Math.dll</HintPath>
              </Reference>
              <Reference Include="0Harmony">
                <HintPath>../libs/0Harmony.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          '@ | Out-File -FilePath build_dir/LargerExplosionsSE.csproj -Encoding utf8

          # Copy source files into the build directory
          cp src/*.cs build_dir/

          # Build the project
          dotnet build build_dir/LargerExplosionsSE.csproj -c Release
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LargerExplosionsSE-DLL
          # Updated path to match the net472 build output
          path: build_dir/bin/Release/net472/LargerExplosionsSE.dll
