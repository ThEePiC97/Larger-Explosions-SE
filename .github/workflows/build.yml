name: Build Plugin
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore and Build
        run: |
          # Use netstandard2.0 instead of net48 for compatibility
          dotnet new classlib -n LargerExplosionsSE -f netstandard2.0 -o build_dir
          cp src/LargerExplosionsSE.cs build_dir/LargerExplosionsSE.cs
          
          # Adding the references using absolute paths based on the repo structure
          echo '<ItemGroup>
            <Reference Include="Sandbox.Game">
              <HintPath>../libs/Sandbox.Game.dll</HintPath>
            </Reference>
            <Reference Include="VRage.Game">
              <HintPath>../libs/VRage.Game.dll</HintPath>
            </Reference>
            <Reference Include="VRage">
              <HintPath>../libs/VRage.dll</HintPath>
            </Reference>
            <Reference Include="VRageMath">
              <HintPath>../libs/VRageMath.dll</HintPath>
            </Reference>
            <Reference Include="0Harmony">
              <HintPath>../libs/0Harmony.dll</HintPath>
            </Reference>
          </ItemGroup>' >> build_dir/LargerExplosionsSE.csproj
          
          dotnet build build_dir/LargerExplosionsSE.csproj -c Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LargerExplosionsSE-DLL
          path: build_dir/bin/Release/netstandard2.0/LargerExplosionsSE.dll
