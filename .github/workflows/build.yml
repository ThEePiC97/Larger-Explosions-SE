name: Build Plugin
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore and Build
        run: |
          # 1. Create the build directory
          mkdir build_dir
          
          # 2. Create the .csproj file from scratch to avoid "multiple root elements" error
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="Sandbox.Game">
                <HintPath>../libs/Sandbox.Game.dll</HintPath>
              </Reference>
              <Reference Include="VRage.Game">
                <HintPath>../libs/VRage.Game.dll</HintPath>
              </Reference>
              <Reference Include="VRage">
                <HintPath>../libs/VRage.dll</HintPath>
              </Reference>
              <Reference Include="VRageMath">
                <HintPath>../libs/VRageMath.dll</HintPath>
              </Reference>
              <Reference Include="0Harmony">
                <HintPath>../libs/0Harmony.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          '@ | Out-File -FilePath build_dir/LargerExplosionsSE.csproj -Encoding utf8

          # 3. Copy the source code into the build directory
          cp src/LargerExplosionsSE.cs build_dir/LargerExplosionsSE.cs
          
          # 4. Build the project
          dotnet build build_dir/LargerExplosionsSE.csproj -c Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LargerExplosionsSE-DLL
          path: build_dir/bin/Release/netstandard2.0/LargerExplosionsSE.dll
